# Local development stack. NOT a production deployment.
#
#   docker compose up --build        API on :3000 (Swagger /docs), Mailpit UI on :8025
#   docker compose up -d postgres    database only (for `pnpm start:dev` / `pnpm test:db`)
#
# The postgres credentials below are local-only placeholders, not secrets.
name: mindcare

x-database-url: &database-url postgresql://mindcare:mindcare@postgres:5432/mindcare

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: mindcare
      POSTGRES_PASSWORD: mindcare
      POSTGRES_DB: mindcare
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindcare -d mindcare']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'

  migrate:
    build:
      context: .
      target: migrator
    environment:
      NODE_ENV: development
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: *database-url
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_SECURE: 'false'
      # Internal metrics: reachable from the compose network, deliberately not published.
      METRICS_PORT: '9464'
    expose:
      - '9464'
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - credentials:/app/.private
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  pgdata:
  credentials:
